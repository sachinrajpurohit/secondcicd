name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Check if Docker is installed, if not, install it automatically
          if ! command -v docker &> /dev/null; then
            echo "Docker not found. Installing Docker automatically..."
            sudo apt-get update -y
            sudo apt-get install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ubuntu
          fi

          # 2. Setup project directory and fix git permissions
          sudo mkdir -p /home/ubuntu/dockerproject
          sudo chown -R ubuntu:ubuntu /home/ubuntu/dockerproject
          cd /home/ubuntu/dockerproject

          # 3. Handle initial Git setup if directory is empty (Using GITHUB_TOKEN dynamically)
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/sachinrajpurohit/firstcicd.git
          else
            # Remote URL ko update karein taaki har baar fresh temporary token use ho sake
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/sachinrajpurohit/firstcicd.git
          fi

          # 4. Fix Git safe directory configuration dynamically
          git config --global --add safe.directory /home/ubuntu/dockerproject

          # 5. Fetch code and deploy app using Docker
          git fetch origin main
          git reset --hard origin/main

          # Force refresh group permissions for the current script session
          sg docker -c "
            docker build -t firstjava:latest .
            docker rm -f firstjavacontainer || true
            docker run -d -p 5000:5000 --name firstjavacontainer firstjava:latest
          "

