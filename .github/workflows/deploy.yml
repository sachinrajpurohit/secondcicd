name: CI/CD Deploy to Cloud

# 1. Pipeline kab chalegi: Jab aap main branch par code push karenge
on:
  push:
    branches:
      - main  # 💡 Agar aapki branch ka naam 'master' hai, toh yahan master likhein

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: GitHub repository se latest code uthayega
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Cloud Server par SSH ke zariye login karke commands chalayega
    - name: Deploying via SSH to AWS Cloud
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |

          # 1. Sabse pehle poore folder ki permission 'ubuntu' user ko wapas dilayein (FETCH_HEAD fix)
          sudo chown -R $USER:$USER ${{ secrets.PROJECT_PATH }}
          
          # 1. Git ko automatic batayein ki yeh directory safe hai (Dubious ownership fix)
          git config --global --add safe.directory ${{ secrets.PROJECT_PATH }}

          # 1. Apne project folder ke andar jayein
          cd ${{ secrets.PROJECT_PATH }}
          
          # 2. GitHub se naya code server par pull karein
          git pull origin main
          
          # 3. Naye code ke saath Docker containers ko rebuild aur restart karein
          docker-compose up --build -d
          
          # 4. Unused/crashed images ko delete karein taaki server ki disk memory na bhare
          docker image prune -f

